[project]
name = "viduniq"
version = "2.1.0"
description = "Уникализатор видео для Reels, TikTok, Shorts и других соцсетей"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
]
bot = [
    "aiogram>=3.20,<4",
]
dev = [
    "pyinstaller>=6.10",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
viduniq = "viduniq.app:main"
viduniq-bot = "viduniq.bot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["viduniq*"]

[tool.setuptools.package-data]
viduniq = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
