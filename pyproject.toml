[project]
name = "viduniq"
version = "2.0.0"
description = "Уникализатор видео для Reels, TikTok, Shorts и других соцсетей"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.10",
    "pytest>=8",
]

[project.scripts]
viduniq = "viduniq.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["viduniq*"]

[tool.setuptools.package-data]
viduniq = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "pytest>=8",
]
