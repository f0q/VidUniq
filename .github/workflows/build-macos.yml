name: Build macOS (arm64)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -e ".[gui,bot,dev]"

      - name: Fetch static ffmpeg
        run: scripts/fetch_ffmpeg.sh

      - name: Tests
        run: uv run pytest -q

      - name: Build .app and .dmg
        run: scripts/build_mac.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidUniq-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          body: |
            ## Установка (macOS 12+, Apple Silicon)
            1. Скачайте `.dmg` ниже, откройте и перетащите **VidUniq** в **Applications**.
            2. Запустите VidUniq.

            > ⚠️ **macOS скажет «не удаётся проверить разработчика» или «приложение повреждено» — это нормально.**
            > Приложение не подписано сертификатом Apple ($99/год), как и любой бесплатный open-source проект без него.
            > Код открыт, сборка сделана публично в GitHub Actions — ничего лишнего внутри нет.
            >
            > **Открыть один раз любым способом:**
            > - дважды кликнуть **«Снять карантин.command»** из образа (после копирования в Applications), или
            > - *Системные настройки → Конфиденциальность и безопасность → «Открыть всё равно»*, или
            > - в Терминале: `xattr -cr /Applications/VidUniq.app`

            ⭐ Понравилось — поставьте звезду: при 100 ⭐ появятся сборки для Windows и macOS Intel ([roadmap](https://github.com/f0q/VidUniq#roadmap)).

            ## 🤖 Telegram-бот для Linux-сервера
            Тот же уникализатор через Telegram: прислали видео → получили обработанную копию (или несколько вариантов с разными случайными параметрами). Все пресеты, фильтры, zoom/скорость, наложение, очистка метаданных; очередь с прогрессом и отменой; доступ только для ваших Telegram ID; файлы до 2 ГБ.
            Готовый Docker-образ: `ghcr.io/f0q/viduniq-bot:latest` (amd64 + arm64). Установка за 5 минут — [docs/bot.md](https://github.com/f0q/VidUniq/blob/main/docs/bot.md).

            ---

            ## Install (macOS 12+, Apple Silicon)
            1. Download the `.dmg` below, open it and drag **VidUniq** to **Applications**.
            2. Launch VidUniq.

            > ⚠️ **macOS will say "cannot verify the developer" or "app is damaged" — this is expected.**
            > The app is not signed with an Apple certificate ($99/year), like any free open-source project without one.
            > The source is open and this build was made publicly in GitHub Actions.
            >
            > **Open it once using any of these:**
            > - double-click **«Снять карантин.command»** (remove quarantine) from the disk image after copying to Applications, or
            > - *System Settings → Privacy & Security → "Open Anyway"*, or
            > - Terminal: `xattr -cr /Applications/VidUniq.app`

            ⭐ Enjoying it? Star the repo — at 100 ⭐ Windows and macOS Intel builds will follow ([roadmap](https://github.com/f0q/VidUniq/blob/main/README.en.md#roadmap)). [English README](https://github.com/f0q/VidUniq/blob/main/README.en.md)

            ## 🤖 Telegram bot for a Linux server
            Same uniqueizer through Telegram: send a video → get a processed copy (or several variants with different random parameters). All presets, filters, zoom/speed, overlay, metadata stripping; queue with progress and cancel; access limited to your Telegram IDs; files up to 2 GB.
            Ready Docker image: `ghcr.io/f0q/viduniq-bot:latest` (amd64 + arm64). 5-minute setup — [docs/bot.md](https://github.com/f0q/VidUniq/blob/main/docs/bot.md#english).
