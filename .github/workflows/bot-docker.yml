name: Bot Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["*.md", "docs/**", "scripts/**", "VidUniq.spec"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: |
          uv venv --python 3.12
          uv pip install -e ".[bot,dev]"
      - name: Tests (ядро + бот, без GUI)
        run: uv run pytest -q --ignore=tests/test_integration.py tests/test_command_builder.py tests/test_progress_parser.py tests/test_bot_store.py tests/test_bot_queue.py tests/test_bot_handlers.py

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/viduniq-bot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
